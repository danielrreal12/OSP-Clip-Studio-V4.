<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12160d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>OSP Clip Studio</title>
  <link rel="stylesheet" href="/static/studio.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">OSP Clip Studio</p>
        <p class="version" id="version">V6</p>
      </div>
    </div>
    <p class="tagline">Autonomous editor for fiber, coax, and outside-plant footage.</p>
  </header>
  <main class="layout">
    <section class="card" aria-labelledby="upload-title">
      <h1 id="upload-title">Edit from the footage</h1>
      <p class="lede">The cut is decided from shots, motion, speech, and what is actually in the frames. Presets are not applied.</p>
      <div id="config-banner" class="banner" hidden></div>
      <form id="form">
        <label class="drop" id="drop">
          <input id="video" name="video" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-m4v,.mp4,.mov,.m4v,.webm,.mkv">
          <span class="drop-title" id="filename">Drop a video or choose one</span>
          <span class="drop-meta" id="file-meta">MP4, MOV, WEBM · phone or Chromebook</span>
        </label>
        <fieldset class="choice">
          <legend>Edit</legend>
          <label><input type="radio" name="mode" value="highlights" checked> Highlights</label>
          <label><input type="radio" name="mode" value="full"> Full job, dead time removed</label>
        </fieldset>
        <fieldset class="choice">
          <legend>Export</legend>
          <label><input type="radio" name="orientation" value="both" checked> Portrait and landscape</label>
          <label><input type="radio" name="orientation" value="portrait"> Portrait</label>
          <label><input type="radio" name="orientation" value="landscape"> Landscape</label>
        </fieldset>
        <label class="stack" for="instructions">Instructions</label>
        <textarea id="instructions" name="instructions" maxlength="2000" placeholder="Example: Keep the splice and the pole work, cut the silence, captions on, no music over speech."></textarea>
        <label class="stack" for="music">Music you have rights to <span>optional</span></label>
        <input id="music" name="music" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac">
        <p class="estimate" id="estimate"></p>
        <p id="form-alert" class="banner bad" hidden></p>
        <button id="submit" type="submit">Create the edit</button>
      </form>
    </section>
    <section class="card" id="job" hidden aria-live="polite">
      <div class="job-head">
        <h2 id="job-title">Working</h2>
        <p id="job-message"></p>
      </div>
      <div class="bar" aria-hidden="true"><div id="fill"></div></div>
      <ol id="stages" class="stages"></ol>
      <div id="alert" class="banner bad" hidden></div>
      <ul id="warnings" class="warnings"></ul>
      <div id="cost" class="cost" hidden></div>
      <div id="plan" hidden></div>
      <div id="compare" class="compare" hidden></div>
      <div id="actions" class="actions" hidden></div>
    </section>
  </main>
  <script src="/static/studio.js"></script>
</body>
</html>
